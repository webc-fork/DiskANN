[workspace]
resolver = "3"

# Release branch: only the renamed, runtime-agnostic crates are workspace
# members. The remaining upstream directories stay in the tree but outside the
# workspace; the unrenamed sibling crates are consumed from crates.io.
members = [
    "diskann",
    "diskann-providers",
    "diskann-inmem",
]

exclude = ["vectorset"]

[workspace.package]
version = "0.59.0-webc.3" # Obeying semver; webc pre-release of upstream 0.59.0
description = "DiskANN3 is a composable library for bringing scalable, accurate and cost-effective vector indexing to multiple databases."
authors = ["Microsoft"]
repository = "https://github.com/webc-fork/DiskANN"
license = "MIT"
edition = "2021"

[workspace.lints.clippy]
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# Renamed, runtime-agnostic release crates (this branch only).
# Default features are opt-in so that runtime-backend selection can be forwarded
# by depending crates (see the `tokio`/`compio` features).
webc-diskann = { path = "diskann", default-features = false, version = "0.59.0-webc.2" }

# Unrenamed sibling crates are consumed from crates.io (upstream 0.59.0).
diskann-utils = { version = "0.59.0", default-features = false }
diskann-vector = "0.59.0"
diskann-wide = "0.59.0"
diskann-quantization = { version = "0.59.0", default-features = false }

# External dependencies (shared versions)
anyhow = "1.0.98"
approx = "0.5.1"
arc-swap = "1.7.1"
bincode = "1.3.3"
bytemuck = "1.23.0"
byteorder = "1.5.0"
cfg-if = "1.0.0"
dashmap = "6.1.0"
futures-util = { version = "0.3.31", default-features = false }
half = "2.6.0"
hashbrown = "0.16.0"
itertools = "0.13.0"
num-traits = "0.2.15"
pin-project = "1.1.8"
proptest = "1.6.0"
rand = "0.9.3"
rand_distr = "0.5"
rayon = "1.10.0"
rstest = "0.23.0"
serde = "1.0.228"
serde_json = "1.0.142"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = "1.48.0"
# Optional thread-per-core runtime backend; only the `runtime` feature is required
# by the diskann crates.
compio = { version = "0.19.2", default-features = false, features = ["runtime"] }
tracing = "0.1.40"
vfs = "0.12.1"

[profile.release]
opt-level = 3
codegen-units = 1
debug = true
split-debuginfo = "packed"

# Much of our code relies on inlining and at least moderate optimizations to run in a
# reasonable time. Setting `opt-level=1` decreases end-to-end test execution significantly
# without blowing up compile times.
#
# Since `profile.test` inherits from `profile.dev` - debug assertions, overflow checks,
# and such are still applied.
#
# See: https://doc.rust-lang.org/cargo/reference/profiles.html#test
[profile.test]
opt-level = 1
