[package]
name = "webc-diskann-inmem"
version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
bytemuck = { workspace = true, features = ["must_cast"] }
crossbeam-queue = "0.3.12"
dashmap.workspace = true
# The workspace entry opts out of default features; the library is
# runtime-agnostic (no tokio/compio dependency).
webc-diskann = { workspace = true }
diskann-utils = { workspace = true, default-features = false }
diskann-vector = { workspace = true }
diskann-wide = { workspace = true }
parking_lot = "0.12.5"
half = { workspace = true }
hashbrown = { workspace = true }
thiserror = { workspace = true }

# Integration Test Dependencies
diskann-benchmark-runner = { version = "0.59.0", optional = true, features = ["ux-tools"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
diskann-benchmark-core = { version = "0.59.0", optional = true }
# Only pulled in by the `integration-test` stress bin (a test runtime); the
# library itself never spawns onto a runtime.
tokio = { workspace = true, optional = true }

[lints.clippy]
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
uninlined_format_args = "allow"

[dev-dependencies]
webc-diskann = { workspace = true, features = ["testing"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }

[[bin]]
name = "integration-test"
path = "integration/main.rs"
required-features = ["integration-test"]

[features]
default = ["tracing"]

# Forward tracing instrumentation of the `diskann` crate (enabled by default,
# matching the previous default-feature behavior).
tracing = ["webc-diskann/tracing"]

# Enable stress test module
integration-test = [
    "dep:diskann-benchmark-runner",
    "dep:diskann-benchmark-core",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:rand",
    "diskann-utils/testing",
]
